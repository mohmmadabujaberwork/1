<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إشراف المنصة - متجرك Jo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { 500: '#22c55e', 600: '#16a34a' } },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <span class="text-sm font-black">إدارة منصة متجرك Jo ⚙️</span>
            <a href="index.html" class="text-xs text-slate-300 font-bold hover:text-white">← العودة للرئيسية</a>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-6 space-y-4">
        <!-- Generate Code -->
        <div class="bg-white p-4 rounded-2xl border space-y-3">
            <h3 class="text-xs font-bold text-slate-800">توليد كود تفعيل سريع للتجار:</h3>
            <div class="flex gap-2">
                <button onclick="genCode()" class="bg-brand-600 text-white text-xs font-bold px-4 py-2 rounded-xl">إنشاء كود جديد</button>
                <input type="text" id="code-out" readonly placeholder="JO-XXXXXX" class="flex-1 px-3 py-2 text-xs font-mono font-bold border rounded-xl bg-slate-50 text-center">
            </div>
        </div>

        <!-- Stores Register -->
        <div class="bg-white p-4 rounded-2xl border space-y-3">
            <h3 class="text-xs font-bold text-slate-800">المتجر الحالي المسجل بالنظام:</h3>
            <div id="admin-store-box" class="text-xs space-y-2"></div>
        </div>
    </main>

    <script>
        function genCode() {
            document.getElementById('code-out').value = 'JO-' + Math.floor(100000 + Math.random()*900000);
        }

        const user = JSON.parse(localStorage.getItem('matjarakjo_user') || 'null');
        const store = JSON.parse(localStorage.getItem('matjarakjo_store') || 'null');
        const box = document.getElementById('admin-store-box');

        if(store && user) {
            box.innerHTML = `<div class="bg-slate-50 p-3 rounded-xl border flex justify-between items-center"><div><p class="font-bold text-slate-900">${store.name} (${store.slug})</p><p class="text-[10px] text-slate-500">التاجر: ${user.name} | ${user.email}</p></div><span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-full">نشط</span></div>`;
        } else {
            box.innerHTML = `<p class="text-slate-400">لا يوجد متاجر متصلة حالياً.</p>`;
        }
    </script>
</body>
</html>
